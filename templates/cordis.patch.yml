# Profile overlay for the vendored DSH Desktop environment.
#
# This file is regenerated by scripts/compose-profile.mjs on every setup run;
# put personal overrides in the Desktop app's own settings instead of editing it
# here. Keys are plugin ids from the composition layer, exactly as the pinned
# plugins declare them in their own cordis.patch.yml.

# The Desktop shell serves the client bundle itself; a Vite dev watcher is not
# part of this deployment.
- id: client-hmr
  disabled: true

- id: dsh-plugin-browser
  config:
    headless: true
    #if-chrome
    executablePath: {{CHROME_EXECUTABLE}}
    #else
    # No Chrome was found when this profile was composed. Install Google Chrome
    # or Chromium, or point DSH_CHROME_EXECUTABLE at a browser binary, then
    # re-run ./setup.sh. Until then the browser plugin reports
    # BROWSER_RUNTIME_MISSING on first use.
    #endif
