# The terminal bundle composes the official local PTY stack and this plugin's
# remote SSH session tools. The base/web profiles already provide subprocess,
# sandbox-policy, jobs, and job tools consumed by these rows.
- insert:
    - id: dsh-terminal-service
      name: '@deepseek-ai/dsh-terminal'
    - id: dsh-terminal-local
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
    - id: dsh-terminal-local-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000
    - id: dsh-tool-terminal
      name: '@deepseek-ai/dsh-tool-terminal'
      config:
        enableRunInBackground: true
        maxResultBytes: 262144
    - id: dsh-plugin-terminal
      name: dsh-plugin-terminal
